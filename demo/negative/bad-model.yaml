objects:
  # Intentionally broken model for validation demo
  - id: sado-island
    kind: area
    name: Sado Island
    spec:
      area_type: island

  - id: forest-osado
    kind: forest
    name: Osado Beech Forest
    attributes:
      owner: sado-island

  # ERROR: invalid enum value for "stability"
  - id: ground-broken-01
    kind: ground
    name: Broken Ground
    attributes:
      owner: forest-osado
    spec:
      soil_type: loam
      slope_deg: 15
      stability: quicksand

  # ERROR: unknown entity kind
  - id: volcano-legacy-01
    kind: volcano
    name: Legacy Volcano
    attributes:
      owner: forest-osado

  # ERROR: population owned by an area instead of a species (population-requires-species)
  - id: toki-count-orphan
    kind: population
    name: Orphan Toki Census
    attributes:
      owner: sado-island
    spec:
      count: 12

  # WARNING: negative count (positive-count)
  - id: medaka-count-bad
    kind: population
    name: Medaka Count Negative
    attributes:
      owner: sado-island
    spec:
      count: -5

  # WARNING: coordinates outside Niigata bounds (valid-niigata-coordinates)
  - id: area-tokyo-branch
    kind: area
    name: Tokyo Branch Office
    attributes:
      owner: sado-island
    spec:
      area_type: city
      latitude: 35.68
      longitude: 139.76

  # WARNING: dependency from a "ground" (not an allowed source kind of depends_on)
  - id: rel-broken-dep
    type: depends_on
    participants:
      source: ground-broken-01
      target: forest-osado
